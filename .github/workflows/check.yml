name: check

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

jobs:
  flake:
    runs-on: ubuntu-latest
    # GitHub-only: this same workflow file is mirrored to a Gitea remote
    # whose host has no runner and no Nix tooling. Gitea Actions picks up
    # `.github/workflows/*.yml` automatically; gating on `github.server_url`
    # ("https://github.com" here, the Gitea URL on that remote) makes the job
    # skip on Gitea, so it never queues for a runner there. To also stop Gitea
    # from even evaluating workflows, disable Actions in the repo settings.
    if: github.server_url == 'https://github.com'
    steps:
      # Actions are pinned to commit SHAs (tags are mutable; a retargeted tag
      # would run attacker-controlled code with the job's token). Update by
      # resolving the new tag's commit and refreshing both the SHA and comment.
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2

      - uses: cachix/install-nix-action@08dcb3a5e62fa31e2da3d490afc4176ef55ecd72 # v30
        with:
          extra_nix_config: |
            experimental-features = nix-command flakes

      # No Nix cache action: magic-nix-cache's GitHub-cache backend was
      # discontinued (its step ran but cached nothing), and the closures here
      # exceed the actions-cache alternatives' useful limits. Builds pull from
      # cache.nixos.org only.

      # Cheap lints first, so a failure in the heavy eval/build steps below
      # can never mask their results.
      - name: Shellcheck scripts
        run: find scripts files -name '*.sh' -type f -print0 | xargs -0 nix shell --inputs-from . nixpkgs#shellcheck --command shellcheck

      - name: nixfmt check
        run: nix fmt -- --check

      - name: deadnix
        run: nix shell --inputs-from . nixpkgs#deadnix --command deadnix --fail .

      - name: statix
        run: nix shell --inputs-from . nixpkgs#statix --command statix check .

      - name: StyLua check
        run: nix shell --inputs-from . nixpkgs#stylua --command stylua --check files/sketchybar

      - name: Prettier check
        run: nix shell --inputs-from . nixpkgs#prettier --command prettier --check "files/**/*.ts"

      # Evaluate the non-native checks (Darwin and aarch64-linux) one check
      # per nix process. A single `nix flake check --no-build --all-systems`
      # accumulates every system's eval in one process and OOM-kills the 7 GB
      # runner ("runner received a shutdown signal"), so each drvPath is
      # forced in a fresh process instead; x86_64-linux is covered by the
      # build step below. Catches eval errors without a macOS runner.
      - name: Evaluate aarch64-darwin and aarch64-linux checks
        run: |
          for system in aarch64-darwin aarch64-linux; do
            for check in $(nix eval ".#checks.$system" --apply builtins.attrNames --json | nix shell --inputs-from . nixpkgs#jq --command jq -r '.[]'); do
              echo "evaluating checks.$system.$check"
              nix eval ".#checks.$system.$check.drvPath"
            done
          done

      # Actually build the checks for the runner's own system (the x86_64-linux
      # Home Manager activation packages), so package/build failures are caught
      # too, not just eval errors. Darwin checks still can't build here.
      - name: nix flake check (build x86_64-linux checks)
        run: nix flake check
