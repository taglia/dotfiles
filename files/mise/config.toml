[tools]
# mise's Node shim sits ahead of the Nix profile in PATH, so it is the
# `node`/`npm` that shells and Pi actually run. Fuzzy resolution is subject to
# `minimum_release_age` below. If a Node security release has to be picked up
# before it clears that gate, pin the exact version here and add
# `minimum_release_age_excludes = ["node"]` under [settings] (the gate hides a
# release even from an exact pin), then undo both once the gate has passed, as
# was done from 2026-10-31 to 2026-11-21.
node = "24"
python = "latest"
uv = "latest"

[settings]
python.uv_venv_auto = true
experimental = true
idiomatic_version_file_enable_tools = ["python"]

# Delay fuzzy tool-version resolution so newly published runtimes and tools
# have a ten-day observation window before mise will select them.
minimum_release_age = "10d"
