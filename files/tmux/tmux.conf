# Increase history limit
set-option -g history-limit 100000

# Use vi keys
setw -g mode-keys vi

# Window numbering (base-index is set through Home Manager's baseIndex option)
set -g renumber-windows on

# General behavior (kept explicit rather than relying on tmux-sensible)
set -sg escape-time 1
set -g display-time 4000
set -g status-interval 5
set -g status-keys emacs
set -g focus-events on
setw -g aggressive-resize on

# Split panes like vim
bind s split-window -v
bind v split-window -h

# Helps with OSC52
set -g allow-passthrough on

# Smart pane switching with vim awareness. Panes running a remote session
# (ssh / Eternal Terminal / mosh) also get the keys forwarded, so a nested
# tmux on the remote host can do its own vim-aware navigation; without this
# the local tmux would swallow C-hjkl and the nested session never sees them.
is_vim_or_remote="ps -o state= -o comm= -t '#{pane_tty}' \
    | grep -iqE '^[^TXZ ]+ +(\\S+\\/)?(g?(view|l?n?vim?x?|fzf)(diff)?|ssh|et|mosh-client)$'"

bind-key -n 'C-h' if-shell "$is_vim_or_remote" 'send-keys C-h'  'select-pane -L'
bind-key -n 'C-j' if-shell "$is_vim_or_remote" 'send-keys C-j'  'select-pane -D'
bind-key -n 'C-k' if-shell "$is_vim_or_remote" 'send-keys C-k'  'select-pane -U'
bind-key -n 'C-l' if-shell "$is_vim_or_remote" 'send-keys C-l'  'select-pane -R'

# Resize panes
bind -r H resize-pane -L 5
bind -r J resize-pane -D 5
bind -r K resize-pane -U 5
bind -r L resize-pane -R 5

# Mouse support
set -g mouse on

# Terminal colors
set -g default-terminal "tmux-256color"
set -ga terminal-overrides ",*:Tc"

# Activity monitoring
setw -g monitor-activity on
set -g visual-activity on

# Clipboard / OSC52
set -s set-clipboard on

bind-key -Tcopy-mode-vi 'v' send -X begin-selection
bind-key -Tcopy-mode-vi 'y' send -X copy-selection-and-cancel

# Session switching with sesh (https://github.com/joshmedeski/sesh)
# Bindings follow the upstream README's recommended setup.
#
# When the last pane of a session dies, jump to the previous session instead
# of detaching from tmux entirely — this is what makes killing sessions from
# the picker (ctrl-d below) feel seamless.
set -g detach-on-destroy off
# Kill panes without the default confirm-before prompt.
bind-key x kill-pane

# Fuzzy session picker in a popup: running tmux sessions, sesh configs and
# zoxide directories in one list; picking an entry connects to it, creating
# the session first if needed.
bind-key "T" run-shell "sesh connect \"$(
  sesh list --icons | fzf-tmux -p 80%,70% \
    --no-sort --ansi --border-label ' sesh ' --prompt '⚡  ' \
    --header '  ^a all ^t tmux ^g configs ^x zoxide ^d tmux kill ^f find' \
    --bind 'tab:down,btab:up' \
    --bind 'ctrl-a:change-prompt(⚡  )+reload(sesh list --icons)' \
    --bind 'ctrl-t:change-prompt(🪟  )+reload(sesh list -t --icons)' \
    --bind 'ctrl-g:change-prompt(⚙️  )+reload(sesh list -c --icons)' \
    --bind 'ctrl-x:change-prompt(📁  )+reload(sesh list -z --icons)' \
    --bind 'ctrl-f:change-prompt(🔎  )+reload(fd -H -d 2 -t d -E .Trash . ~)' \
    --bind 'ctrl-d:execute(tmux kill-session -t {2..})+change-prompt(⚡  )+reload(sesh list --icons)' \
    --preview-window 'right:55%' \
    --preview 'sesh preview {}'
)\""

# Jump back to the previous session. The README binds this to L, but L is
# taken by resize-pane above, so use b ("back") instead.
bind -N "last-session (via sesh)" b run-shell "sesh last"

# Durable hide/show popup
set -g @popup-autostart on
set -gF @popup-id-format '#{b:pane_current_path}/{popup_name}'
bind h run "#{@popup-toggle} -Ed'##{pane_current_path}' -w90% -h90% --name=scratch"

# Session persistence (tmux-resurrect + tmux-continuum)
# Saves land in ~/.tmux/resurrect on each machine, so every host keeps and
# restores its own sessions independently. Manual save/restore stays on
# prefix + Ctrl-s / Ctrl-r; continuum auto-saves every 15 min and
# auto-restores when the server starts.
set -g @resurrect-capture-pane-contents 'on'
# Re-launch remote connections on restore. et's argv ("et host") is stable
# and replayable, unlike mosh panes, which run "mosh-client <ip> <port>" with
# a one-time key that can never reconnect — so mosh panes are not listed.
set -g @resurrect-processes 'ssh et'
set -g @continuum-restore 'on'
# Resurrect never prunes old snapshots (~96/day with 15-min autosaves), so
# drop anything older than 30 days at server start. The "last" symlink always
# points at a recent file, so the restorable snapshot is never touched.
# Until the first save the directory does not exist; find's exit 1 would
# make tmux print a run-shell error, so swallow it.
run-shell -b "find ~/.tmux/resurrect -name 'tmux_resurrect_*.txt' -mtime +30 -delete 2>/dev/null || true"

# Status bar and catppuccin config
# Status bar position
set -g status-position top

# Enable shift+enter behavior
# extended-keys always forces tmux to send extended key sequences to panes
# even when the pane program (e.g. ssh) hasn't requested the kitty keyboard
# protocol. With "on" instead of "always", tmux translates Shift+Enter to a
# plain Enter for panes that haven't negotiated extkeys, so the sequence
# never reaches the remote tmux through SSH.
#
# extended-keys-format csi-u makes tmux re-encode keys as CSI u sequences
# (e.g. Shift+Enter = \x1b[13;2u), which is what AI CLI agents like crush
# expect. The default "xterm" format produces \x1b[27;2;13~ instead, which
# agents don't recognize.
#
# terminal-features advertises extkeys support per terminal type: xterm*
# covers direct sessions (Ghostty reports xterm-ghostty); tmux* covers
# nested tmux (local tmux -> SSH -> remote tmux), where the remote tmux
# sees its outer terminal as tmux-256color.
set -s extended-keys always
set -s extended-keys-format csi-u
set -as terminal-features 'xterm*:extkeys'
set -as terminal-features 'tmux*:extkeys'

# Status modules
# tmux-cpu expands its placeholders into long nix-store command paths, so the
# default limit of 100 can truncate the raw status format before it is rendered.
set -g status-right-length 2000
set -g status-left-length 100

set -g status-left "#{E:@catppuccin_status_session}"

set -g status-right "#{E:@catppuccin_status_user}"
# Keep tmux-cpu placeholders directly in status-right so its interpolation
# script can replace them; it cannot see placeholders nested in another option.
# Match catppuccin's user module: rounded accent on the left, square text block.
set -ag status-right "#[fg=#{@thm_yellow}]#[fg=#{@thm_crust},bg=#{@thm_yellow}] #[fg=#{@thm_fg},bg=#{@thm_surface_0}] #{cpu_percentage} #[default]"
set -ag status-right "#[fg=#{@thm_mauve}]#[fg=#{@thm_crust},bg=#{@thm_mauve}]󰍛 #[fg=#{@thm_fg},bg=#{@thm_surface_0}] #{ram_percentage} #[default]"
set -ag status-right "#{E:@catppuccin_status_uptime}"

# Hostname and OS form one blue field at the extreme right: rounded only on
# the left, with the OS icon following the hostname in the same field.
set -ag status-right "#[fg=#{@thm_blue}]#[fg=#{@thm_crust},bg=#{@thm_blue}]󰒋 #[fg=#{@thm_fg},bg=#{@thm_surface_0}] #h #[fg=#{@thm_crust},bg=#{@thm_blue}] #($HOME/.config/tmux/os-icon.sh)#[fg=#{@thm_blue},bg=default]"

set -g @catppuccin_flavor "mocha"
set -g @catppuccin_window_status_style "rounded"
set -g @catppuccin_window_text "#W"
set -g @catppuccin_window_current_text "#W"
set -g @catppuccin_window_current_fill "number"
set -g @catppuccin_window_current_style "rounded"
# There is an issue with the current tab, the following lines fix it (source: https://github.com/catppuccin/tmux/issues/564)
set -g @catppuccin_window_current_left_separator "#{@catppuccin_window_left_separator}"
set -g @catppuccin_window_current_right_separator "#{@catppuccin_window_right_separator}"
